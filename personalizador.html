<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.custom">ÁUREA · Crea tu pegatina</title>
  <meta name="description" content="Diseña tu pegatina: elige texto, tipografía, color, tamaño y acabado. Vista previa en vivo.">
  <meta name="theme-color" content="#FFFDF5">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/stickers/luna.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Saltar al contenido</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span class="brand-text">
          <strong>ÁUREA</strong>
          <small data-i18n="brand.tag">Sticker Atelier</small>
        </span>
      </a>

      <nav class="nav" aria-label="Principal">
        <ul>
          <li><a href="index.html#tienda" data-i18n="nav.shop">Tienda</a></li>
          <li><a href="personalizador.html" data-i18n="nav.custom">Personaliza</a></li>
          <li><a href="index.html#opiniones" data-i18n="nav.reviews">Opiniones</a></li>
          <li><a href="index.html#faq" data-i18n="nav.faq">Preguntas</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <button class="lang-btn" id="langBtn" type="button" data-i18n-aria="header.lang">EN</button>
        <a class="cart-btn" href="carrito.html" data-i18n-aria="header.cart">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <path d="M6 8h12l1.2 12H4.8L6 8z"/>
            <path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>
          </svg>
          <span class="cart-badge" data-cart-badge hidden>0</span>
          <span class="fav-badge" data-fav-badge hidden>0</span>
        </a>
        <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="mobileNav" data-i18n-aria="header.menu">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
      </div>
    </div>

    <nav class="mobile-nav" id="mobileNav" aria-label="Móvil">
      <a href="index.html#tienda" data-i18n="nav.shop">Tienda</a>
      <a href="personalizador.html" data-i18n="nav.custom">Personaliza</a>
      <a href="index.html#opiniones" data-i18n="nav.reviews">Opiniones</a>
      <a href="index.html#faq" data-i18n="nav.faq">Preguntas</a>
    </nav>
  </header>

  <main class="page-main" id="main">
    <div class="container">
      <nav class="breadcrumb" aria-label="Migas de pan">
        <a href="index.html" data-i18n="product.home">Inicio</a>
        <span>/</span>
        <span data-i18n="custom.kicker"></span>
      </nav>

      <div class="custom-layout">
        <div class="custom-panel">
          <p class="eyebrow" data-i18n="custom.kicker"></p>
          <h1 class="product-title" data-i18n="custom.title"></h1>
          <p class="section-lead" data-i18n="custom.lead"></p>

          <div class="field" style="margin-top:32px">
            <label class="field-label" for="customImage" data-i18n="custom.imageLabel"></label>
            <input type="file" id="customImage" accept="image/*" data-i18n-aria="custom.imageAria">
            <p class="field-hint" data-i18n="custom.imageHint"></p>
            <div id="imagePreview" class="image-preview" hidden>
              <img id="imagePreviewImg" src="" alt="" class="image-preview-img">
              <button type="button" id="imageRemove" class="btn btn-sm btn-ghost" style="margin-top:8px;width:auto;padding:0 14px" data-i18n="custom.imageRemove"></button>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="customText" data-i18n="custom.textLabel"></label>
            <input class="text-input" id="customText" type="text" maxlength="24" value="" autocomplete="off" data-i18n-placeholder="custom.textPlaceholder">
            <p class="field-hint" data-i18n="custom.textHintOptional"></p>
          </div>

          <div class="field">
            <span class="field-label" id="fontLabel" data-i18n="custom.font"></span>
            <div class="font-grid" role="group" aria-labelledby="fontLabel">
              <button type="button" class="font-option is-active" data-font="elegant" style="font-family:'Cormorant Garamond', Georgia, serif" data-i18n="custom.fontElegant"></button>
              <button type="button" class="font-option" data-font="modern" style="font-family:'Jost', 'Segoe UI', sans-serif" data-i18n="custom.fontModern"></button>
              <button type="button" class="font-option" data-font="classic" style="font-family:Georgia, 'Times New Roman', serif" data-i18n="custom.fontClassic"></button>
              <button type="button" class="font-option" data-font="sans" style="font-family:'Montserrat', Arial, sans-serif" data-i18n="custom.fontSans"></button>
              <button type="button" class="font-option" data-font="serif" style="font-family:'Playfair Display', Georgia, serif" data-i18n="custom.fontSerif"></button>
              <button type="button" class="font-option" data-font="script" style="font-family:'Great Vibes', cursive" data-i18n="custom.fontScript"></button>
              <button type="button" class="font-option" data-font="handwriting" style="font-family:'Caveat', cursive" data-i18n="custom.fontHandwriting"></button>
              <button type="button" class="font-option" data-font="display" style="font-family:'Bebas Neue', Impact, sans-serif" data-i18n="custom.fontDisplay"></button>
              <button type="button" class="font-option" data-font="rounded" style="font-family:'Nunito', 'Segoe UI', sans-serif" data-i18n="custom.fontRounded"></button>
              <button type="button" class="font-option" data-font="playful" style="font-family:'Pacifico', cursive" data-i18n="custom.fontPlayful"></button>
              <button type="button" class="font-option" data-font="vintage" style="font-family:'Lobster', cursive" data-i18n="custom.fontVintage"></button>
              <button type="button" class="font-option" data-font="typewriter" style="font-family:'Special Elite', 'Courier New', monospace" data-i18n="custom.fontTypewriter"></button>
              <button type="button" class="font-option" data-font="condensed" style="font-family:'Oswald', 'Arial Narrow', sans-serif" data-i18n="custom.fontCondensed"></button>
              <button type="button" class="font-option" data-font="romantic" style="font-family:'Dancing Script', cursive" data-i18n="custom.fontRomantic"></button>
              <button type="button" class="font-option" data-font="tech" style="font-family:'Orbitron', 'Segoe UI', sans-serif" data-i18n="custom.fontTech"></button>
              <button type="button" class="font-option" data-font="gothic" style="font-family:'Cinzel', Georgia, serif" data-i18n="custom.fontGothic"></button>
              <button type="button" class="font-option" data-font="casual" style="font-family:'Patrick Hand', 'Comic Sans MS', cursive" data-i18n="custom.fontCasual"></button>
              <button type="button" class="font-option" data-font="bold" style="font-family:'Anton', Impact, sans-serif" data-i18n="custom.fontBold"></button>
              <button type="button" class="font-option" data-font="soft" style="font-family:'Quicksand', 'Segoe UI', sans-serif" data-i18n="custom.fontSoft"></button>
              <button type="button" class="font-option" data-font="pixel" style="font-family:'Press Start 2P', monospace" data-i18n="custom.fontPixel"></button>
            </div>
          </div>

          <div class="field">
            <span class="field-label" id="colorLabel" data-i18n="custom.color"></span>
            <div class="swatches" role="group" aria-labelledby="colorLabel">
              <button class="swatch is-active" type="button" data-color="#a8793f" style="--swatch:#a8793f" data-i18n-aria="color.gold"></button>
              <button class="swatch" type="button" data-color="#17131f" style="--swatch:#17131f" data-i18n-aria="color.ink"></button>
              <button class="swatch" type="button" data-color="#2C3E50" style="--swatch:#2C3E50" data-i18n-aria="color.night"></button>
              <button class="swatch" type="button" data-color="#718096" style="--swatch:#718096" data-i18n-aria="color.gray"></button>
              <button class="swatch" type="button" data-color="#FFFFFF" style="--swatch:#FFFFFF" data-i18n-aria="color.white"></button>
              <button class="swatch" type="button" data-color="#FF6B6B" style="--swatch:#FF6B6B" data-i18n-aria="color.coral"></button>
              <button class="swatch" type="button" data-color="#FF8A80" style="--swatch:#FF8A80" data-i18n-aria="color.coralLight"></button>
              <button class="swatch" type="button" data-color="#FFD166" style="--swatch:#FFD166" data-i18n-aria="color.yellow"></button>
              <button class="swatch" type="button" data-color="#F4A261" style="--swatch:#F4A261" data-i18n-aria="color.orange"></button>
              <button class="swatch" type="button" data-color="#E76F51" style="--swatch:#E76F51" data-i18n-aria="color.terracotta"></button>
              <button class="swatch" type="button" data-color="#C0392B" style="--swatch:#C0392B" data-i18n-aria="color.red"></button>
              <button class="swatch" type="button" data-color="#9B2226" style="--swatch:#9B2226" data-i18n-aria="color.garnet"></button>
              <button class="swatch" type="button" data-color="#4ECDC4" style="--swatch:#4ECDC4" data-i18n-aria="color.mint"></button>
              <button class="swatch" type="button" data-color="#2A9D8F" style="--swatch:#2A9D8F" data-i18n-aria="color.teal"></button>
              <button class="swatch" type="button" data-color="#1D7874" style="--swatch:#1D7874" data-i18n-aria="color.petrol"></button>
              <button class="swatch" type="button" data-color="#357A6B" style="--swatch:#357A6B" data-i18n-aria="color.forest"></button>
              <button class="swatch" type="button" data-color="#A8E6CF" style="--swatch:#A8E6CF" data-i18n-aria="color.softGreen"></button>
              <button class="swatch" type="button" data-color="#8B5CF6" style="--swatch:#8B5CF6" data-i18n-aria="color.violet"></button>
              <button class="swatch" type="button" data-color="#5F4FD6" style="--swatch:#5F4FD6" data-i18n-aria="color.indigo"></button>
              <button class="swatch" type="button" data-color="#3A0CA3" style="--swatch:#3A0CA3" data-i18n-aria="color.deepBlue"></button>
              <button class="swatch" type="button" data-color="#B5179E" style="--swatch:#B5179E" data-i18n-aria="color.magenta"></button>
              <button class="swatch" type="button" data-color="#F72585" style="--swatch:#F72585" data-i18n-aria="color.fuchsia"></button>
              <button class="swatch" type="button" data-color="#FF99C8" style="--swatch:#FF99C8" data-i18n-aria="color.bubblegum"></button>
              <button class="swatch" type="button" data-color="#A8576C" style="--swatch:#A8576C" data-i18n-aria="color.oldRose"></button>
              <button class="swatch" type="button" data-color="#E3BD7D" style="--swatch:#E3BD7D" data-i18n-aria="color.lightGold"></button>
              <button class="swatch" type="button" data-color="#C69A58" style="--swatch:#C69A58" data-i18n-aria="color.ochre"></button>
              <button class="swatch" type="button" data-color="#7B4B2A" style="--swatch:#7B4B2A" data-i18n-aria="color.brown"></button>
              <button class="swatch" type="button" data-color="#000000" style="--swatch:#000000" data-i18n-aria="color.black"></button>
            </div>
            <div class="color-custom">
              <label for="customColor" data-i18n="custom.customColor"></label>
              <input type="color" id="customColor" value="#a8793f" data-i18n-aria="custom.customColor">
            </div>
          </div>

          <div class="field">
            <span class="field-label" id="customSizeLabel" data-i18n="custom.size"></span>
            <div class="size-control">
              <input type="range" id="customSize" min="5" max="90" step="1" value="8" aria-labelledby="customSizeLabel">
              <div class="size-meta">
                <span>5 cm</span>
                <output id="customSizeValue" for="customSize">8 cm</output>
                <span>90 cm</span>
              </div>
            </div>
          </div>

          <div class="field">
            <span class="field-label" id="customFinishLabel" data-i18n="custom.finish"></span>
            <div class="seg wrap" role="group" aria-labelledby="customFinishLabel">
              <button type="button" data-finish="matte" class="is-active" data-i18n="product.matte"></button>
              <button type="button" data-finish="gloss" data-i18n="product.gloss"></button>
              <button type="button" data-finish="satin" data-i18n="product.satin"></button>
              <button type="button" data-finish="holo" data-i18n="product.holo"></button>
              <button type="button" data-finish="glitter" data-i18n="product.glitter"></button>
              <button type="button" data-finish="metallic" data-i18n="product.metallic"></button>
              <button type="button" data-finish="neon" data-i18n="product.neon"></button>
              <button type="button" data-finish="transparent" data-i18n="product.transparent"></button>
            </div>
          </div>

          <div class="price-row">
            <span class="opt-label" data-i18n="custom.price"></span>
            <span class="price-value" id="customPrice">$7.50</span>
          </div>

          <button class="btn btn-primary btn-block" type="button" id="customAdd">
            <span data-i18n="custom.add"></span>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M5 12h14M12 5v14"/>
            </svg>
          </button>
          <p class="field-hint" style="margin-top:14px" data-i18n="custom.note"></p>
        </div>

        <div class="preview-panel">
          <div class="preview-stage" id="stickerPreview"></div>
          <div class="preview-tools">
            <div class="preview-tool">
              <label for="imageZoom" data-i18n="custom.imageZoom"></label>
              <div class="preview-tool-row">
                <input type="range" id="imageZoom" min="0.5" max="3" step="0.05" value="1">
                <output id="imageZoomValue" for="imageZoom">100%</output>
              </div>
            </div>
            <div class="preview-tool">
              <label for="textZoom" data-i18n="custom.textZoom"></label>
              <div class="preview-tool-row">
                <input type="range" id="textZoom" min="0.5" max="2.5" step="0.05" value="1">
                <output id="textZoomValue" for="textZoom">100%</output>
              </div>
            </div>
            <p class="preview-hint" data-i18n="custom.dragHint"></p>
            <button class="btn btn-sm btn-ghost preview-reset" type="button" id="resetPosition" data-i18n="custom.resetPosition"></button>
          </div>
          <p class="preview-caption" data-i18n="custom.preview"></p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <a class="brand" href="index.html">
            <span class="brand-mark" aria-hidden="true">✦</span>
            <span class="brand-text">
              <strong>ÁUREA</strong>
              <small data-i18n="brand.tag">Sticker Atelier</small>
            </span>
          </a>
          <p data-i18n="footer.about"></p>
        </div>
        <div class="footer-col">
          <h2 data-i18n="footer.shopTitle"></h2>
          <a href="index.html#tienda" data-i18n="footer.shopAll"></a>
          <a href="personalizador.html" data-i18n="footer.custom"></a>
          <a href="carrito.html" data-i18n="nav.shop"></a>
        </div>
        <div class="footer-col">
          <h2 data-i18n="footer.helpTitle"></h2>
          <a href="index.html#faq" data-i18n="footer.shipping"></a>
          <a href="mailto:hola@aurea.studio" data-i18n="footer.contact"></a>
          <a href="index.html#faq" data-i18n="nav.faq"></a>
        </div>
        <div class="footer-col">
          <h2 data-i18n="footer.legalTitle"></h2>
          <a href="legal.html#aviso" data-i18n="footer.legal"></a>
          <a href="legal.html#privacidad" data-i18n="footer.privacy"></a>
          <a href="legal.html#cookies" data-i18n="footer.cookies"></a>
          <a href="legal.html#condiciones" data-i18n="footer.terms"></a>
        </div>
      </div>
      <div class="footer-bottom">
        <span>© <span id="year">2026</span> ÁUREA · <span data-i18n="footer.rights"></span></span>
        <div class="legal-links">
          <a href="legal.html#privacidad" data-i18n="footer.privacy"></a>
          <a href="legal.html#cookies" data-i18n="footer.cookies"></a>
          <span id="paymentBadge" data-i18n="footer.demo"></span>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/personalizador.js"></script>
</body>
</html>
