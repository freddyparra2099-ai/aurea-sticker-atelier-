<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.home">ÁUREA · Pegatinas de diseño personalizables</title>
  <meta name="description" content="Pegatinas de vinilo premium troqueladas a mano. Colección original y personalizador en vivo. Envío en 24–48 h.">
  <meta name="theme-color" content="#0b0a10">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/stickers/luna.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Saltar al contenido</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span class="brand-text">
          <strong>ÁUREA</strong>
          <small data-i18n="brand.tag">Sticker Atelier</small>
        </span>
      </a>

      <nav class="nav" aria-label="Principal">
        <ul>
          <li><a href="#tienda" data-i18n="nav.shop">Tienda</a></li>
          <li><a href="personalizador.html" data-i18n="nav.custom">Personaliza</a></li>
          <li><a href="#opiniones" data-i18n="nav.reviews">Opiniones</a></li>
          <li><a href="#faq" data-i18n="nav.faq">Preguntas</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <button class="lang-btn" id="langBtn" type="button" data-i18n-aria="header.lang">EN</button>
        <a class="cart-btn" href="carrito.html" data-i18n-aria="header.cart">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <path d="M6 8h12l1.2 12H4.8L6 8z"/>
            <path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>
          </svg>
          <span class="cart-badge" data-cart-badge hidden>0</span>
          <span class="fav-badge" data-fav-badge hidden>0</span>
        </a>
        <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="mobileNav" data-i18n-aria="header.menu">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
      </div>
    </div>

    <nav class="mobile-nav" id="mobileNav" aria-label="Móvil">
      <a href="#tienda" data-i18n="nav.shop">Tienda</a>
      <a href="personalizador.html" data-i18n="nav.custom">Personaliza</a>
      <a href="#opiniones" data-i18n="nav.reviews">Opiniones</a>
      <a href="#faq" data-i18n="nav.faq">Preguntas</a>
    </nav>
  </header>

  <main id="main">
    <section class="hero">
      <div class="container hero-grid">
        <div class="hero-copy">
          <p class="eyebrow" data-i18n="hero.eyebrow"></p>
          <h1 class="display" data-i18n-html="hero.title"></h1>
          <p class="lead" data-i18n="hero.lead"></p>
          <div class="actions">
            <a class="btn btn-primary" href="#tienda">
              <span data-i18n="hero.ctaShop"></span>
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M13 6l6 6-6 6"/>
              </svg>
            </a>
            <a class="btn btn-ghost" href="personalizador.html" data-i18n="hero.ctaCustom"></a>
          </div>
        </div>

        <div class="hero-art" aria-hidden="true">
          <span class="hero-ring"></span>
          <div class="sticker-float sf-1"><img src="assets/stickers/mariposa.svg" alt=""></div>
          <div class="sticker-float sf-2"><img src="assets/stickers/luna.svg" alt=""></div>
          <div class="sticker-float sf-3"><img src="assets/stickers/ojo.svg" alt=""></div>
        </div>
      </div>
    </section>

    <div class="marquee" aria-hidden="true">
      <div class="marquee-track">
        <ul class="marquee-list">
          <li><span data-i18n="marquee.1"></span></li>
          <li><span data-i18n="marquee.2"></span></li>
          <li><span data-i18n="marquee.3"></span></li>
          <li><span data-i18n="marquee.4"></span></li>
          <li><span data-i18n="marquee.5"></span></li>
          <li><span data-i18n="marquee.6"></span></li>
        </ul>
        <ul class="marquee-list" aria-hidden="true">
          <li><span data-i18n="marquee.1"></span></li>
          <li><span data-i18n="marquee.2"></span></li>
          <li><span data-i18n="marquee.3"></span></li>
          <li><span data-i18n="marquee.4"></span></li>
          <li><span data-i18n="marquee.5"></span></li>
          <li><span data-i18n="marquee.6"></span></li>
        </ul>
      </div>
    </div>

    <section class="section" id="tienda">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" data-i18n="shop.kicker"></p>
          <h2 class="h2" data-i18n="shop.title"></h2>
          <p class="section-lead" data-i18n="shop.lead"></p>
        </div>

        <div class="toolbar">
          <div class="chips" role="group" aria-label="Categorías">
            <button class="chip is-active" type="button" data-cat="all" data-i18n="shop.all"></button>
            <button class="chip" type="button" data-cat="celestial" data-i18n="shop.celestial"></button>
            <button class="chip" type="button" data-cat="botanical" data-i18n="shop.botanical"></button>
            <button class="chip" type="button" data-cat="abstract" data-i18n="shop.abstract"></button>
            <button class="chip" type="button" data-cat="retro" data-i18n="shop.retro"></button>
            <button class="chip" type="button" data-cat="typography" data-i18n="shop.typography"></button>
            <button class="chip" type="button" data-cat="minimal" data-i18n="shop.minimal"></button>
          </div>
          <div class="toolbar-right">
            <label class="search">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <circle cx="11" cy="11" r="6.5"/>
                <path d="M16 16l4.5 4.5"/>
              </svg>
              <input type="search" id="searchInput" data-i18n-placeholder="shop.search" autocomplete="off">
            </label>
            <select class="sort" id="sortSelect" data-i18n-aria="shop.sort">
              <option value="featured" data-i18n="shop.sortFeatured"></option>
              <option value="price-asc" data-i18n="shop.sortPriceAsc"></option>
              <option value="price-desc" data-i18n="shop.sortPriceDesc"></option>
            </select>
          </div>
        </div>

        <div class="grid-products" id="productGrid"></div>
        <p class="empty-state" id="emptyState" hidden data-i18n="shop.empty"></p>
      </div>
    </section>

    <section class="section" id="personaliza">
      <div class="container split">
        <div class="split-copy">
          <p class="eyebrow" data-i18n="teaser.kicker"></p>
          <h2 class="h2" data-i18n="teaser.title"></h2>
          <p class="section-lead" data-i18n="teaser.lead"></p>
          <ol class="steps">
            <li class="step">
              <span class="step-num">1</span>
              <div>
                <h3 data-i18n="teaser.step1"></h3>
                <p data-i18n="teaser.step1d"></p>
              </div>
            </li>
            <li class="step">
              <span class="step-num">2</span>
              <div>
                <h3 data-i18n="teaser.step2"></h3>
                <p data-i18n="teaser.step2d"></p>
              </div>
            </li>
            <li class="step">
              <span class="step-num">3</span>
              <div>
                <h3 data-i18n="teaser.step3"></h3>
                <p data-i18n="teaser.step3d"></p>
              </div>
            </li>
          </ol>
          <a class="btn btn-primary" href="personalizador.html">
            <span data-i18n="teaser.cta"></span>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </a>
        </div>
        <div class="split-visual">
          <div class="teaser-preview" id="teaserPreview"></div>
        </div>
      </div>
    </section>

    <section class="section" id="opiniones">
      <div class="container">
        <div class="section-head center">
          <p class="eyebrow" data-i18n="reviews.kicker"></p>
          <h2 class="h2" data-i18n="reviews.heading"></h2>
          <p class="section-lead" data-i18n="reviews.empty"></p>
        </div>
        <div class="reviews-grid" id="reviewsList"></div>

        <form class="review-form" id="reviewForm" novalidate>
          <h3 class="form-title" data-i18n="reviews.form.title"></h3>
          <div class="form-grid">
            <label class="field full">
              <span class="field-label" data-i18n="reviews.form.name"></span>
              <input type="text" name="name" required autocomplete="name">
            </label>
            <label class="field full">
              <span class="field-label" data-i18n="reviews.form.email"></span>
              <input type="email" name="email" required autocomplete="email">
            </label>
          </div>
          <label class="field">
            <span class="field-label" data-i18n="reviews.form.rating"></span>
            <select name="rating" required>
              <option value="5">5 ★</option>
              <option value="4">4 ★</option>
              <option value="3">3 ★</option>
              <option value="2">2 ★</option>
              <option value="1">1 ★</option>
            </select>
          </label>
          <label class="field full">
            <span class="field-label" data-i18n="reviews.form.message"></span>
            <textarea name="message" rows="4" required></textarea>
          </label>
          <button class="btn btn-primary btn-block" type="submit" data-i18n="reviews.form.submit"></button>
          <p class="form-status" id="reviewStatus" role="status" aria-live="polite" hidden></p>
        </form>
      </div>
    </section>

    <section class="section" id="faq">
      <div class="container">
        <div class="section-head center">
          <p class="eyebrow" data-i18n="faq.kicker"></p>
          <h2 class="h2" data-i18n="faq.title"></h2>
        </div>
        <div class="faq">
          <details>
            <summary data-i18n="faq.q1"></summary>
            <p data-i18n="faq.a1"></p>
          </details>
          <details>
            <summary data-i18n="faq.q2"></summary>
            <p data-i18n="faq.a2"></p>
          </details>
          <details>
            <summary data-i18n="faq.q3"></summary>
            <p data-i18n="faq.a3"></p>
          </details>
          <details>
            <summary data-i18n="faq.q4"></summary>
            <p data-i18n="faq.a4"></p>
          </details>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="newsletter">
          <div class="newsletter-grid">
            <div>
              <h2 data-i18n="newsletter.title"></h2>
              <p data-i18n="newsletter.lead"></p>
            </div>
            <div>
              <form class="newsletter-form" id="newsletterForm" novalidate>
                <input type="email" id="newsletterEmail" name="email" required autocomplete="email" data-i18n-placeholder="newsletter.placeholder" aria-label="Email">
                <button class="btn btn-primary" type="submit" data-i18n="newsletter.button"></button>
              </form>
              <label class="newsletter-consent">
                <input type="checkbox" id="newsletterConsent" name="consent" required>
                <span><span data-i18n="newsletter.consent"></span> <a href="legal.html#privacidad" data-i18n="newsletter.consentLink"></a></span>
              </label>
              <p class="newsletter-note" data-i18n="newsletter.note"></p>
              <p class="newsletter-status" id="newsletterStatus" role="status" aria-live="polite" hidden></p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <a class="brand" href="index.html">
            <span class="brand-mark" aria-hidden="true">✦</span>
            <span class="brand-text">
              <strong>ÁUREA</strong>
              <small data-i18n="brand.tag">Sticker Atelier</small>
            </span>
          </a>
          <p data-i18n="footer.about"></p>
        </div>
        <div class="footer-col">
          <h3 data-i18n="footer.shopTitle"></h3>
          <a href="index.html#tienda" data-i18n="footer.shopAll"></a>
          <a href="personalizador.html" data-i18n="footer.custom"></a>
          <a href="carrito.html" data-i18n="nav.shop"></a>
        </div>
        <div class="footer-col">
          <h3 data-i18n="footer.helpTitle"></h3>
          <a href="index.html#faq" data-i18n="footer.shipping"></a>
          <a href="mailto:hola@aurea.studio" data-i18n="footer.contact"></a>
          <a href="index.html#faq" data-i18n="nav.faq"></a>
        </div>
        <div class="footer-col">
          <h3 data-i18n="footer.legalTitle"></h3>
          <a href="legal.html#aviso" data-i18n="footer.legal"></a>
          <a href="legal.html#privacidad" data-i18n="footer.privacy"></a>
          <a href="legal.html#cookies" data-i18n="footer.cookies"></a>
          <a href="legal.html#condiciones" data-i18n="footer.terms"></a>
        </div>
      </div>
      <div class="footer-bottom">
        <span>© <span id="year">2026</span> ÁUREA · <span data-i18n="footer.rights"></span></span>
        <div class="legal-links">
          <a href="legal.html#privacidad" data-i18n="footer.privacy"></a>
          <a href="legal.html#cookies" data-i18n="footer.cookies"></a>
          <span id="paymentBadge" data-i18n="footer.demo"></span>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
